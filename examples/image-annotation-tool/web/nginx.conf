server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Image batches are uploaded through the API.
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: let the client-side router handle everything else.
    location / {
        try_files $uri /index.html;
    }
}
