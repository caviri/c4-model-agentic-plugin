.tone-rose { --tone: var(--rose); --tone-soft: var(--rose-soft); }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 380px; }
[hidden] { display: none !important; }

/* ---------- toolbar ---------- */
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.brand b { font-family: var(--f-display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.group { display: flex; align-items: center; gap: 6px; }
.group > span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--bg); }
.seg button { font: 500 12.5px var(--f-mono); color: var(--muted); background: transparent; border: 0; padding: 6px 10px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.seg button[class*="tone-"][aria-pressed="true"] { background: var(--tone); }
.btn { font: 500 12.5px var(--f-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.search { position: relative; }
.search input { font: 13px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px 7px 28px; width: 220px; }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 15px; }
.search input:focus, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#search-hits { position: absolute; top: calc(100% + 4px); left: 0; width: 320px; max-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px var(--shadow); padding: 4px; z-index: 20; }
#search-hits button { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; cursor: pointer; color: var(--ink); font: 13px var(--f-body); }
#search-hits button:hover, #search-hits button.on { background: var(--accent-soft); }
#search-hits small { grid-column: 2; color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
#search-hits i { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--accent); padding-top: 2px; }

/* ---------- canvas ---------- */
.stage { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#map.panning { cursor: grabbing; }
.hud { position: absolute; display: flex; gap: 6px; z-index: 3; }
.hud.zoom { right: 14px; bottom: 14px; flex-direction: column; }
.hud.zoom .btn { width: 34px; height: 34px; padding: 0; font-size: 16px; display: grid; place-items: center; }
.hud.crumb { left: 14px; top: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; max-width: calc(100% - 28px); flex-wrap: wrap; }
.hud.crumb b { color: var(--ink); font-weight: 500; }
#minimap { position: absolute; left: 14px; bottom: 14px; width: 200px; height: 130px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; z-index: 3; cursor: pointer; }
.hint { position: absolute; left: 226px; bottom: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); z-index: 3; pointer-events: none; }

/* ---------- SVG ---------- */
.bgdot { fill: var(--grid); }
.nd { cursor: pointer; transition: opacity .25s; }
.nd:focus { outline: none; }
/* with a selection (map and board): boxes it is not connected to fade (--dim-node); an open box around a connected one
   fades only a little, so its frame and title still give context (--dim-frame); unrelated arrows and labels fade (--dim-edge).
   Opacity, not colour, so it reads the same in every theme; a theme may set the three variables. The variant filter's
   fade (.mx-*, appended later at the same specificity) wins where both apply. */
.has-sel .nd-dim { opacity: var(--dim-node, .3); }
.has-sel .nd-ctx { opacity: var(--dim-frame, .85); }
.box { stroke-width: 1.5; transition: opacity .25s; }
.sh { fill: var(--shadow); }
.k-person .box { fill: var(--accent); stroke: var(--accent); }
.k-person:not(.open) text { fill: var(--bg) !important; }
.k-system .box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.k-container .box { fill: var(--surface); stroke: var(--accent); }
.k-code .box { fill: var(--surface); stroke: var(--line); }
.k-ext .box, .k-store .box { fill: var(--code-bg); stroke: var(--ext); }
.k-sibling .box { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 6 4; }
.k-tone .box { fill: var(--tone-soft); stroke: var(--tone); }
.k-state .box { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
.ring { fill: none; stroke: var(--accent); stroke-width: 1.2; pointer-events: none; }
.k-tone .ring { stroke: var(--tone); }
.init circle { fill: var(--ink); } .init path { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.dashed .box { stroke-dasharray: 6 4; }
.open .box { stroke-dasharray: 7 5; stroke-width: 1.6; }
.open.d0 .box { fill: var(--b1); } .open.d1 .box { fill: var(--b2); } .open.d2 .box { fill: var(--b3); }
.open.k-system .box, .open.k-container .box { stroke: var(--accent); }
.open .sh { display: none; }
.nd:focus-visible .box, .nd.sel .box { stroke: var(--accent); stroke-width: 3; }
.t-tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .13em; fill: var(--muted); }
.t-name { font-family: var(--f-body); font-weight: 600; font-size: 15px; fill: var(--ink); }
.open .t-name { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.t-code .t-name { font-family: var(--f-mono); font-weight: 500; font-size: 13.5px; }
.t-sub { font-family: var(--f-mono); font-size: 11.5px; fill: var(--muted); }
.badge rect { fill: var(--accent); }
.badge text { font-family: var(--f-mono); font-size: 11px; font-weight: 500; fill: var(--bg); }
.badge:hover rect { filter: brightness(1.12); }
.k-person .badge rect { fill: var(--bg); } .k-person .badge text { fill: var(--accent) !important; }
.closebtn rect { fill: var(--surface); stroke: var(--line); }
.closebtn text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.closebtn:hover rect { stroke: var(--accent); }
.modes circle { stroke-width: 1.4; stroke: var(--tone); }
.modes .on { fill: var(--tone); }
.modes .off { fill: none; opacity: .5; }
.lowzoom .t-sub, .lowzoom .elab, .lowzoom .modes { display: none; }
/* arrow widths: --arrow-w normal, --arrow-w-hot selected or hovered, --arrow-hit hover / click target (unset: the fallbacks) */
.e { fill: none; stroke: var(--muted); stroke-width: var(--arrow-w, 1.6px); transition: opacity .25s; }
.e.k-tone { stroke: var(--tone); } .e.k-accent { stroke: var(--accent); }
.e.dash { stroke-dasharray: 6 5; }
.mk { fill: var(--muted); } .mk.k-tone { fill: var(--tone); } .mk.k-accent { fill: var(--accent); }
.elab rect { fill: var(--bg); stroke: var(--line); }
.elab text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }   /* the core sizes labels for this font: LBL in the core script */
.elab.k-tone text { fill: var(--tone); } .elab.k-accent text { fill: var(--accent); }
.has-sel .e:not(.hot), .has-sel .elab:not(.hot) { opacity: var(--dim-edge, .16); }
.e.hot { stroke-width: var(--arrow-w-hot, 2.4px); }
.elab.hot rect { stroke: var(--muted); }
#map:not(.labels) .elab { display: none; }
/* folded labels: a marker on the arrow; the full label shows on hover or click of the arrow or marker, or when an end box is selected */
.ehit { fill: none; stroke: transparent; stroke-width: var(--arrow-hit, 12px); pointer-events: stroke; cursor: pointer; }
#map:not(.labels) .ehit, .lowzoom .ehit { pointer-events: none; }
.elab { cursor: pointer; }
.elab > .emark, .elab.folded > rect, .elab.folded > text, .elab.folded.reveal > .emark { display: none; }
.elab.folded > .emark, .elab.folded.reveal > rect, .elab.folded.reveal > text { display: inline; }
.emark rect { stroke: var(--muted); stroke-width: 1.2; }
.emark circle { fill: var(--muted); }
.elab.k-tone .emark rect { stroke: var(--tone); } .elab.k-tone .emark circle { fill: var(--tone); }
.elab.k-accent .emark rect { stroke: var(--accent); } .elab.k-accent .emark circle { fill: var(--accent); }
.elab.reveal > rect { stroke: var(--ink); stroke-width: 1.2; }
.e.hover { stroke-width: var(--arrow-w-hot, 2.4px); }
.has-sel .e.hover, .has-sel .elab.reveal { opacity: 1; }
/* sequence inside a box (map): lifelines for its parts, dashed cards for what is outside it */
.seq-rule { stroke: var(--line); stroke-width: 1; }
.seq-kick { font-family: var(--f-mono); font-size: 10px; letter-spacing: .13em; fill: var(--muted); }
.seq-scname { font-family: var(--f-body); font-weight: 600; font-size: 13.5px; fill: var(--ink); letter-spacing: 0; }
.sp { cursor: pointer; }
.sp-box { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }
.sp.out .sp-box { fill: var(--code-bg); stroke: var(--ext); stroke-dasharray: 5 4; }
.sp:hover .sp-box { stroke-width: 2.2; }
.sp.sel .sp-box { stroke: var(--accent); stroke-width: 2.8; }
.sp-tag { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em; fill: var(--muted); }
.sp-name { font-family: var(--f-body); font-weight: 600; font-size: 13px; fill: var(--ink); }
.seqin .hitbox { fill: transparent; }
.seqin .seq-msg { cursor: pointer; transition: opacity .25s; }
.seqin .seq-msg:hover .hitbox { fill: var(--accent-soft); opacity: .7; }
.seqin .e.hot { stroke-width: 1.8; } .seqin .e.cur { stroke-width: 2.6; }
.has-sel .seqin .seq-msg:not(.hot):not(.cur) { opacity: .3; }
.lowzoom .seqin .lbl, .lowzoom .seq-bar text, .lowzoom .sp-tag { display: none; }
.seq-play.on rect { fill: var(--accent); stroke: var(--accent); } .seq-play.on text { fill: var(--bg); }

/* ---------- panel ---------- */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; min-width: 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) 24px 18px; }
.panel h2 { font-family: var(--f-display); font-size: 22px; line-height: 1.2; margin: 4px 0 6px; text-wrap: balance; }
.panel h3 { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; font-weight: 500; }
.panel p { margin: 0 0 10px; line-height: 1.55; font-size: 14px; color: var(--ink); }
.panel ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; }
.panel li { margin: 3px 0; }
.ptag { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .13em; color: var(--muted); text-transform: uppercase; }
.pcrumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.pcrumb button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
.pcrumb button:hover { text-decoration: underline; }
.psub { color: var(--muted); font-family: var(--f-mono); font-size: 12.5px !important; }
.none { color: var(--muted) !important; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 11.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.chip[class*="tone-"] { color: var(--tone); background: var(--tone-soft); border-color: transparent; }
.path { font-family: var(--f-mono); font-size: 12px; background: var(--code-bg); border-radius: 7px; padding: 8px 10px; word-break: break-all; display: block; margin-bottom: 8px; color: var(--ink); }
.ext-link { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); text-decoration: none; border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 10px; }
.ext-link:hover { background: var(--accent-soft); }
.rel { display: grid; gap: 4px; }
.rel button { display: grid; grid-template-columns: 16px 1fr; gap: 0 6px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; color: var(--ink); font: 13px var(--f-body); }
.rel button:hover { border-color: var(--accent); }
.rel button small { grid-column: 2; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.rel button i { font-style: normal; color: var(--muted); }
.rel button.mx { opacity: .45; }
/* several selected: one row per box, the × takes it out of the selection */
.selrow { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
.rel .selrow i { color: var(--accent); }
.rel button.unsel { display: block; padding: 7px 12px; text-align: center; color: var(--muted); font: 15px var(--f-mono); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kids button { font: 12.5px var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; cursor: pointer; color: var(--ink); }
.kids button:hover { border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; align-items: center; }
.keys kbd { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--bg); white-space: nowrap; }
.keys span { color: var(--muted); }
.legend { display: grid; grid-template-columns: 28px 1fr; gap: 7px 10px; align-items: center; font-size: 13px; }
.legend svg { width: 28px; height: 18px; }
.legend .box { stroke-width: 1.5; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.sheet-toggle { display: none; }
.export, .themes { position: relative; }
#export-menu, #theme-menu { position: absolute; top: calc(100% + 4px); right: 0; width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px var(--shadow); padding: 4px; z-index: 20; }
#export-menu button, #theme-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; cursor: pointer; color: var(--ink); font: 500 13px var(--f-body); }
#export-menu button:hover, #export-menu button:focus-visible, #theme-menu button:hover, #theme-menu button:focus-visible { background: var(--accent-soft); outline: none; }
#export-menu small, #theme-menu small { display: block; color: var(--muted); font: 11px var(--f-mono); margin-top: 2px; }
#export-msg { margin: 0; padding: 0 8px; font: 11.5px/1.45 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
#export-msg:not(:empty) { padding: 6px 8px 8px; border-top: 1px solid var(--line); margin-top: 4px; }
#export-msg.bad { color: var(--orange); }
/* theme menu: one row per theme with a swatch drawn in that theme's own tokens (the swatch carries data-theme) */
#theme-menu { width: 264px; max-width: calc(100vw - 32px); }
#theme-menu button { display: grid; grid-template-columns: 40px minmax(0, 1fr) 14px; gap: 0 10px; align-items: center; }
#theme-menu button[aria-checked="true"]::after { content: "✓"; color: var(--accent); font: 600 13px var(--f-mono); }
#theme-menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.sw { display: flex; gap: 3px; align-items: center; justify-content: center; height: 24px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.sw i, .sw b::after { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.sw i + i { background: var(--teal); } .sw i + i + i { background: var(--rose); }
.sw-auto { gap: 0; }
.sw-auto b { flex: 1; align-self: stretch; display: grid; place-items: center; background: var(--bg); }
.sw-auto b::after { content: ""; }

/* ---------- views ---------- */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
#v-map { display: block; }
.tabs button { font-family: var(--f-body); font-weight: 600; font-size: 13px; }
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.vbar b { font-family: var(--f-display); font-size: 16px; }
.vbar .muted, .muted { color: var(--muted); font-size: 12.5px; }
.vbar .spacer { flex: 1; }
.vbar select { font: 500 13px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; max-width: 100%; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
#pins-count { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.board { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.board.fit { width: 100%; height: 100%; max-width: none; }
#dyn-seq { display: grid; width: max-content; min-width: 100%; }
.seq-corner { position: sticky; top: 0; left: 0; z-index: 4; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 14px; }
.seq-corner b { font-family: var(--f-display); font-size: 15px; }
.seq-corner span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.seq-head { position: sticky; top: 0; z-index: 3; display: block; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 6px 12px -8px var(--shadow); }
.seq-side { position: sticky; left: 0; z-index: 2; display: block; background: var(--surface); border-right: 1px solid var(--line); box-shadow: 6px 0 12px -8px var(--shadow); }
.seq-body { display: block; }
.seq-row { cursor: pointer; }
.seq-row .hitbox { fill: transparent; }
.seq-row:hover .hitbox { fill: var(--accent-soft); opacity: .5; }
.seq-sub { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.lane { fill: var(--b1); stroke: var(--line); stroke-dasharray: 5 5; }
.lane-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; fill: var(--ink); }
.cbtn rect { fill: var(--surface); stroke: var(--line); }
.cbtn text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.cbtn:hover rect { stroke: var(--accent); } .cbtn:hover text { fill: var(--ink); }
.k-person .cbtn text { fill: var(--muted) !important; }
.pinmark { pointer-events: none; }
.pinmark circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.pinmark path { stroke: var(--surface); stroke-width: 1.6; fill: none; }
.nd:not(.pinned) .pinmark { display: none; }
.dlab rect { fill: var(--surface); stroke: var(--line); }
.dlab text { font-family: var(--f-mono); font-size: 11.5px; fill: var(--ink); cursor: pointer; }
.dlab text.k-tone { fill: var(--tone); }
.dlab text.cur { fill: var(--accent); font-weight: 600; }
.e.cur { stroke: var(--accent); stroke-width: 3; }
.life { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 5; }
.num { fill: var(--accent); }
.num-t { font-family: var(--f-mono); font-size: 10px; font-weight: 500; fill: var(--bg); }
.seq-msg { cursor: pointer; }
.seq-lp { fill: var(--bg); }
.seq-t { font-family: var(--f-mono); font-size: 12px; fill: var(--ink); }
.seq-t.cur { font-weight: 600; fill: var(--accent); }
.seq-cur { fill: var(--accent-soft); }
.seq-band.k-tone { fill: var(--tone-soft); opacity: .65; }
.seq-mode { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; }
.seq-mode.k-tone { fill: var(--tone); }
table.steps { border-collapse: collapse; width: calc(100% - 32px); margin: 16px; font-size: 13.5px; }
table.steps th { text-align: left; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.steps td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
table.steps td:first-child { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
table.steps td span.arrow { color: var(--muted); }
table.steps tr { cursor: pointer; }
table.steps tr:hover td { background: var(--bg); }
table.steps tr.cur td { background: var(--accent-soft); }

/* ---------- scenario picker (Dynamic) ---------- */
#sc-modal { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font-family: var(--f-body);
  width: min(720px, calc(100vw - 32px)); max-height: min(82vh, 780px); box-shadow: 0 24px 60px var(--shadow); }
#sc-modal::backdrop { background: var(--backdrop, rgba(10, 18, 26, .45)); }   /* the fallback is for browsers whose ::backdrop does not inherit tokens */
.scm { padding: 18px 20px 20px; }
.scm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 0; }
.scm-head h2 { font-family: var(--f-display); font-size: 22px; margin: 2px 0 0; }
.scm-intro { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 8px 0 14px; }
.scm-list { display: grid; gap: 8px; }
.scm-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; cursor: pointer; color: var(--ink); font: 14px var(--f-body); }
.scm-item:hover, .scm-item:focus-visible { border-color: var(--accent); outline: none; }
.scm-item.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.scm-n { font: 600 12px var(--f-mono); width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; }
.scm-body { display: grid; gap: 5px; min-width: 0; }
.scm-body b { font-family: var(--f-display); font-size: 16px; }
.scm-body b i { font: 500 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-left: 8px; font-style: normal; }
.scm-desc { line-height: 1.5; }
.scm-path { font: 12px/1.5 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.scm-path em { font-style: normal; color: var(--accent); padding: 0 2px; }
.scm-meta { font: 11.5px var(--f-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- model error screen ---------- */
.fatal { position: fixed; inset: 0; z-index: 99; overflow: auto; background: var(--bg); color: var(--ink); padding: 32px max(24px, 8vw); font-family: var(--f-body); }
.fatal h1 { font-family: var(--f-display); font-size: 24px; margin: 0 0 8px; }
.fatal p { color: var(--muted); margin: 0 0 16px; }
.fatal li { font-family: var(--f-mono); font-size: 13px; margin: 6px 0; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .group { flex-wrap: wrap; }
  .brand { margin-right: 0; width: 100%; }
  .stats { grid-template-columns: repeat(2, 1fr) !important; }
  .panel { min-width: 0; overflow-x: hidden; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .panel.min { max-height: 52px; overflow: hidden; }
  .sheet-toggle { display: block; float: right; }
  .search input { width: 150px; }
  #minimap, .hint { display: none; }
  .brand b { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .box, .e { transition: none; } }

<body>
<div class="app">
  <header class="bar">
    <div class="brand"><small id="brand-sub"></small><b id="brand-title">Architecture map</b></div>
    <div class="group" role="group" aria-label="View">
      <div class="seg tabs" id="tabs">
        <button type="button" data-view="map" aria-pressed="true" title="Explore by opening boxes (M)">Map</button>
        <button type="button" data-view="pins" title="Pinned elements by level (B)">Pinned</button>
        <button type="button" data-view="dynamic" title="Dynamic diagrams: collaboration, sequence, steps (D)">Dynamic</button>
      </div>
    </div>
    <div class="group grp-level" role="group" aria-label="Open to level"><span>Level</span>
      <div class="seg" id="levels"></div>
    </div>
    <div class="group" id="grp-modes" role="group" hidden><span id="modes-label"></span>
      <div class="seg" id="modes"></div>
    </div>
    <div class="group">
      <div class="search"><input id="q" type="search" placeholder="Find a box ( / )" autocomplete="off" aria-label="Find an element"><div id="search-hits" hidden></div></div>
      <button type="button" class="btn" id="btn-labels" aria-pressed="true" title="Arrow labels (L)">labels</button>
      <button type="button" class="btn" id="btn-edges" title="Arrow style: right-angled or straight (E)">edges</button>
      <div class="themes"><button type="button" class="btn" id="btn-theme" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" title="Colour theme (T cycles through them)">theme: auto ▾</button>
        <div id="theme-menu" role="menu" aria-label="Colour theme" hidden></div></div>
      <div class="export"><button type="button" class="btn" id="btn-export" aria-haspopup="true" aria-expanded="false" title="Download the model as an RDF graph">export ▾</button>
        <div id="export-menu" hidden>
          <button type="button" data-export="jsonld">JSON-LD<small>the architecture as an RDF graph (.jsonld)</small></button>
          <button type="button" data-export="rete">rete graph<small>one queryable file (.rete); fetches the builder from a CDN</small></button>
          <p id="export-msg" role="status"></p>
        </div></div>
    </div>
  </header>

  <main class="stage" id="stage">
   <section class="view" id="v-map">
    <svg id="map" class="labels" aria-label="Architecture map. Boxes with a plus badge open to show what is inside.">
      <defs id="defs">
        <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle class="bgdot" cx="2" cy="2" r="1.3"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#dots)" id="bg"/>
      <g id="vp"><g id="L-bounds"></g><g id="L-edges"></g><g id="L-nodes"></g><g id="L-labels"></g></g>
    </svg>
    <div class="hud crumb" id="crumb" aria-live="polite"></div>
    <div class="hud zoom">
      <button type="button" class="btn" id="z-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button type="button" class="btn" id="z-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
      <button type="button" class="btn" id="z-fit" title="Fit everything (F)" aria-label="Fit everything">⤢</button>
    </div>
    <svg id="minimap" aria-label="Minimap: click to move there"><g id="mm"></g><rect id="mm-view" fill="none" stroke-width="1.5"/></svg>
    <div class="hint">drag to pan · scroll to zoom · double-click a box to open it</div>
   </section>
   <section class="view" id="v-pins" hidden>
    <div class="vbar"><b>Pinned board</b><span id="pins-count"></span><span class="muted">Each pin keeps its own level; arrows show how the pinned pieces connect.</span>
      <span class="spacer"></span><button type="button" class="btn" id="pins-reset">default pins</button><button type="button" class="btn" id="pins-clear">clear</button></div>
    <div class="scroll" id="pins-wrap"><svg id="pins" class="board" aria-label="Pinned elements in lanes, one per level, with their relationships"></svg></div>
   </section>
   <section class="view" id="v-dynamic" hidden>
    <div class="vbar">
      <select id="dyn-sc" aria-label="Scenario"></select>
      <button type="button" class="btn" id="dyn-pick" aria-haspopup="dialog" title="All scenarios, with what each one shows (S)">☰ all scenarios</button>
      <dialog id="sc-modal" aria-labelledby="sc-modal-title"></dialog>
      <div class="group"><span>Draw at</span><div class="seg" id="dyn-level"></div></div>
      <div class="group"><span>As</span><div class="seg" id="dyn-style">
        <button type="button" data-st="collab" aria-pressed="true">collaboration</button><button type="button" data-st="seq">sequence</button><button type="button" data-st="list">steps</button></div></div>
      <div class="group"><button type="button" class="btn" id="dyn-prev" aria-label="Previous step">◀</button><button type="button" class="btn" id="dyn-play">▶ play</button><button type="button" class="btn" id="dyn-next" aria-label="Next step">▶</button>
        <span id="dyn-count" class="count"></span></div>
      <span id="dyn-folded" class="muted"></span>
    </div>
    <div class="scroll" id="dyn-wrap">
      <svg id="dyn-collab" class="board" aria-label="Collaboration diagram with numbered interactions"></svg>
      <div id="dyn-seq" class="seqgrid" hidden role="group" aria-label="Sequence diagram with sticky participant headers and a sticky step list"></div>
      <div id="dyn-list" hidden></div>
    </div>
   </section>
  </main>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<!-- =====================================================================
     ENGINE. Do not edit below this line when filling in a project.
     ===================================================================== -->
<script id="validator">
/* BEGIN VALIDATOR */
/* Colour themes, in menu order. Each id needs a [data-theme="id"] block in the <style> above that sets every colour token.
   `auto` (light, or dark when the OS asks for it) is always offered first and is not listed here. */
window.ARCH_THEMES = [
  { id: 'light', note: 'cool grey and navy' },
  { id: 'dark', note: 'deep navy, soft colours' },
  { id: 'contrast', note: 'high contrast, black on white' },
  { id: 'paper', note: 'warm cream, prints well' },
  { id: 'blueprint', note: 'deep blue, pale line work' },
  { id: 'graphite', note: 'charcoal and slate, muted' }
];
/* Checks a MODEL against the schema. Returns { errors: [...], warnings: [...] }.
   Runs in the browser at boot and in scripts/check-model.mjs, so it must stay free of DOM access. */
window.validateArchModel = function (M) {
  var E = [], W = [];
  var LEVEL = { person: 1, system: 1, ext: 1, sibling: 1, container: 2, store: 2, component: 3, code: 4, state: 9 };
  // closed box widths, as in SIZE of the core: they decide how much text fits on a box
  var BOXW = { person: 250, system: 300, container: 260, store: 240, component: 264, code: 272, ext: 224, sibling: 250, state: 200 };
  function fits(w, field, s, max) { if (s.length > max) W.push(w + ': ' + field + ' is ' + s.length + ' characters; the box shows ' + max + ' and cuts the rest with "…" (the panel shows it in full).'); }
  function labelFits(w, field, s) { if (s.length > 36 || s.split(' ').some(function (x) { return x.length > 20; })) W.push(w + ': ' + field + ' "' + s + '" does not fit on an arrow: one line holds 16 characters, two lines up to 20 each (broken at a space); the rest is cut.'); }
  var TONES = ['teal', 'orange', 'green', 'violet', 'rose'];
  var NODE_KINDS = ['person', 'system', 'container', 'store', 'code', 'ext', 'sibling', 'state', 'highlight', 'plain'].concat(TONES);
  var EDGE_KINDS = ['ink', 'accent'].concat(TONES);
  function str(x) { return typeof x === 'string' && x.trim().length > 0; }
  function badUrl(u) { return typeof u !== 'string' || /^\s*(javascript|data|vbscript):/i.test(u); }
  if (!M || typeof M !== 'object') { E.push('MODEL is missing or not an object.'); return { errors: E, warnings: W }; }
  if (!M.project || !str(M.project.name)) E.push('project.name is required.');
  if (M.placeholder) W.push('This is still the placeholder model shipped with the template (placeholder: true). Replace the whole MODEL block.');
  if (M.source !== undefined) {
    if (typeof M.source !== 'object' || M.source === null) E.push('source must be an object.');
    else if (M.source.repoUrl && !/^https?:\/\//.test(M.source.repoUrl)) E.push('source.repoUrl must start with http:// or https://.');
  }

  // variants
  var vids = {};
  if (M.variants !== undefined) {
    var items = M.variants && M.variants.items;
    if (!Array.isArray(items)) E.push('variants.items must be an array (or remove "variants" entirely).');
    else {
      if (items.length === 1) W.push('variants has a single item: a filter with one choice is pointless, remove it.');
      if (items.length > 5) W.push('variants has ' + items.length + ' items: more than 5 crowds the dots on each box and reuses colours.');
      items.forEach(function (v, i) {
        if (!v || !str(v.id)) { E.push('variants.items[' + i + '].id is required.'); return; }
        if (vids[v.id]) E.push('Duplicate variant id "' + v.id + '".');
        vids[v.id] = true;
        if (v.tone !== undefined && TONES.indexOf(v.tone) < 0) E.push('Variant "' + v.id + '": tone must be one of ' + TONES.join(', ') + '.');
      });
    }
  }
  function checkVariants(list, where) {
    if (list === undefined) return;
    if (!Array.isArray(list) || !list.length) { E.push(where + ': variants must be a non-empty array of variant ids (omit it for "all").'); return; }
    list.forEach(function (id) { if (!vids[id]) E.push(where + ': unknown variant "' + id + '".'); });
  }

  // nodes
  var byId = {};
  if (!Array.isArray(M.nodes) || !M.nodes.length) { E.push('nodes must be a non-empty array.'); return { errors: E, warnings: W }; }
  M.nodes.forEach(function (n, i) {
    var w = 'nodes[' + i + ']' + (n && n.id ? ' "' + n.id + '"' : '');
    if (!n || typeof n !== 'object') { E.push(w + ' is not an object.'); return; }
    if (!str(n.id)) { E.push(w + ': id is required.'); return; }
    if (byId[n.id]) { E.push('Duplicate node id "' + n.id + '".'); return; }
    byId[n.id] = n;
    if (!LEVEL[n.type]) E.push(w + ': type must be one of ' + Object.keys(LEVEL).join(', ') + '.');
    if (!str(n.name)) E.push(w + ': name is required.');
    else if (BOXW[n.type]) fits(w, 'name', n.name, Math.floor((BOXW[n.type] - 24) / ((n.type === 'code' ? 13.5 : 15) * 0.6)));
    if (BOXW[n.type] && typeof n.tag === 'string') fits(w, 'tag', n.tag, Math.floor((BOXW[n.type] - 20) / 7.32));
    if (BOXW[n.type] && typeof n.sub === 'string') fits(w, 'sub', n.sub, Math.floor((BOXW[n.type] - 24) / 6.9));
    if (n.type === 'state' && (n.parent === undefined || n.parent === null)) E.push(w + ': a state needs a parent (the box that owns the lifecycle).');
    if ((n.initial || n.final) && n.type !== 'state') W.push(w + ': initial / final only apply to type "state".');
    if (n.kind !== undefined && NODE_KINDS.indexOf(n.kind) < 0) E.push(w + ': kind must be one of ' + NODE_KINDS.join(', ') + '.');
    if (n.at !== undefined && !(Array.isArray(n.at) && n.at.length === 2 && isFinite(n.at[0]) && isFinite(n.at[1]) && typeof n.at[0] === 'number' && typeof n.at[1] === 'number')) E.push(w + ': at must be [column, row] numbers.');
    if (n.notes !== undefined && !Array.isArray(n.notes)) E.push(w + ': notes must be an array of strings.');
    if (n.tech !== undefined && !Array.isArray(n.tech) && typeof n.tech !== 'string') E.push(w + ': tech must be a string or an array of strings.');
    if (n.path !== undefined && typeof n.path !== 'string') E.push(w + ': path must be a string.');
    if (n.line !== undefined && !(typeof n.line === 'number' && n.line > 0)) E.push(w + ': line must be a positive number.');
    if (n.line !== undefined && n.path === undefined) W.push(w + ': line is ignored without path.');
    if (n.url !== undefined && badUrl(n.url)) E.push(w + ': url must be an http(s) or relative link.');
    if (!str(n.desc)) W.push(w + ': no desc, so its details panel will be empty.');
    checkVariants(n.variants, w);
  });
  var groups = {};
  M.nodes.forEach(function (n) {
    if (!n || !byId[n.id] || byId[n.id] !== n) return;
    var w = 'Node "' + n.id + '"';
    if (n.parent !== undefined && n.parent !== null) {
      var p = byId[n.parent];
      if (!p) { E.push(w + ': parent "' + n.parent + '" does not exist.'); return; }
      var hops = 0;
      for (var x = p; x && hops <= M.nodes.length; x = x.parent != null ? byId[x.parent] : null) { if (x === n) { E.push(w + ': parent chain loops back to itself.'); return; } hops++; }
      if (LEVEL[p.type] && LEVEL[n.type] && LEVEL[p.type] >= LEVEL[n.type]) W.push(w + ' (' + n.type + ') sits inside "' + p.id + '" (' + p.type + '): a child should be a deeper level than its parent.');
    } else if (LEVEL[n.type] > 1) {
      W.push(w + ' is a ' + n.type + ' with no parent: top-level boxes should be person, system, ext or sibling.');
    }
    var g = n.parent == null ? '(top level)' : n.parent;
    (groups[g] = groups[g] || []).push(n);
  });
  Object.keys(groups).forEach(function (g) {
    var list = groups[g], withAt = list.filter(function (n) { return Array.isArray(n.at); }), seen = {};
    if (withAt.length && withAt.length < list.length) W.push('Children of ' + g + ': only some have "at", so all of them are laid out automatically. Give every one a position or none.');
    if (withAt.length === list.length) withAt.forEach(function (n) { var k = n.at.join(','); if (seen[k]) E.push('Nodes "' + seen[k] + '" and "' + n.id + '" share position [' + k + '] inside ' + g + ' and would overlap.'); seen[k] = n.id; });
    var sts = list.filter(function (n) { return n.type === 'state'; });
    if (sts.length && sts.length < list.length) W.push(g + ' mixes states with other boxes: give the lifecycle its own box and put only the states in it.');
    if (sts.length > 1 && !sts.some(function (n) { return n.initial; })) W.push(g + ' holds states but none is marked initial: true.');
    if (list.length > 12) W.push(g + ' has ' + list.length + ' direct children: more than 12 is hard to read, consider grouping them.');
  });
  function inside(a, b) { var hops = 0; for (var x = a; x && hops <= M.nodes.length; x = x.parent != null ? byId[x.parent] : null) { if (x === b) return true; hops++; } return false; }

  // edges
  if (M.edges !== undefined && !Array.isArray(M.edges)) E.push('edges must be an array.');
  (Array.isArray(M.edges) ? M.edges : []).forEach(function (e, i) {
    var w = 'edges[' + i + ']';
    if (!e || typeof e !== 'object') { E.push(w + ' is not an object.'); return; }
    w += ' ' + e.from + ' → ' + e.to;
    var ok = true;
    ['from', 'to'].forEach(function (k) { if (!byId[e[k]]) { E.push(w + ': ' + k + ' "' + e[k] + '" is not a node id.'); ok = false; } });
    if (!str(e.label)) E.push(w + ': label is required.');
    else labelFits(w, 'label', e.label);
    if (e.summary !== undefined) { if (!str(e.summary)) E.push(w + ': summary must be a non-empty string.'); else labelFits(w, 'summary', e.summary); }
    if (e.kind !== undefined && EDGE_KINDS.indexOf(e.kind) < 0) E.push(w + ': kind must be one of ' + EDGE_KINDS.join(', ') + '.');
    checkVariants(e.variants, w);
    if (ok && !(e.from === e.to && byId[e.from].type === 'state') && (inside(byId[e.from], byId[e.to]) || inside(byId[e.to], byId[e.from]))) W.push(w + ': connects a box to its own ancestor/descendant (or itself) and is never drawn.');
  });
  if (!Array.isArray(M.edges) || !M.edges.length) W.push('No edges: the map will show boxes without relationships.');

  // scenarios
  if (M.scenarios !== undefined && !Array.isArray(M.scenarios)) E.push('scenarios must be an array.');
  var sids = {};
  (Array.isArray(M.scenarios) ? M.scenarios : []).forEach(function (s, i) {
    var w = 'scenarios[' + i + ']' + (s && s.id ? ' "' + s.id + '"' : '');
    if (!s || typeof s !== 'object') { E.push(w + ' is not an object.'); return; }
    if (!str(s.id)) E.push(w + ': id is required.'); else { if (sids[s.id]) E.push('Duplicate scenario id "' + s.id + '".'); sids[s.id] = true; }
    if (!str(s.name)) E.push(w + ': name is required.');
    if (!Array.isArray(s.steps) || !s.steps.length) { E.push(w + ': steps must be a non-empty array.'); return; }
    s.steps.forEach(function (st, j) {
      var ws = w + ' step ' + (j + 1);
      if (!st || typeof st !== 'object') { E.push(ws + ' is not an object.'); return; }
      ['from', 'to'].forEach(function (k) { if (!byId[st[k]]) E.push(ws + ': ' + k + ' "' + st[k] + '" is not a node id.'); });
      if (st.from === st.to && byId[st.from]) E.push(ws + ': from and to are the same node.');
      if (!str(st.label)) E.push(ws + ': label is required.');
      checkVariants(st.variants, ws);
    });
  });

  // pins + view
  if (M.defaultPins !== undefined) {
    if (!Array.isArray(M.defaultPins)) E.push('defaultPins must be an array of node ids.');
    else M.defaultPins.forEach(function (id) { if (!byId[id]) E.push('defaultPins: "' + id + '" is not a node id.'); });
  }
  if (M.view !== undefined) {
    if (!M.view || typeof M.view !== 'object') E.push('view must be an object.');
    else {
      if (M.view.startLevel !== undefined && [1, 2, 3, 4].indexOf(M.view.startLevel) < 0) E.push('view.startLevel must be 1, 2, 3 or 4.');
      if (M.view.edges !== undefined && ['orthogonal', 'straight'].indexOf(M.view.edges) < 0) E.push('view.edges must be "orthogonal" or "straight".');
      var themeIds = ['auto'].concat((window.ARCH_THEMES || []).map(function (t) { return t.id; }));
      if (M.view.theme !== undefined && themeIds.indexOf(M.view.theme) < 0) E.push('view.theme must be one of ' + themeIds.map(function (t) { return '"' + t + '"'; }).join(', ') + '.');
      if (M.view.open !== undefined) {
        if (!Array.isArray(M.view.open)) E.push('view.open must be an array of node ids.');
        else M.view.open.forEach(function (id) { if (!byId[id]) E.push('view.open: "' + id + '" is not a node id.'); });
      }
    }
  }
  if (M.levelNames !== undefined && !(Array.isArray(M.levelNames) && M.levelNames.length === 4 && M.levelNames.every(str))) E.push('levelNames must be an array of 4 strings.');
  if (M.legend !== undefined && (typeof M.legend !== 'object' || M.legend === null)) E.push('legend must be an object of kind → label.');

var dyn = { sc: 0, level: String(Math.min(2, MAXL)), style: 'collab', styleChosen: false, step: 0, timer: null };
function liftDyn(n) {
  var chain = ancestors(n).concat([n]);

}

  sc.steps.forEach(function (s) {
    if (mode !== 'all' && s.modes.indexOf(mode) < 0) return;
    var a = liftDyn(byId[s.from]), b = liftDyn(byId[s.to]);

    if (last && last.a === a && last.b === b && last.ret === s.ret) { last.labels.push(s.label); last.raw.push(s); s.modes.split('').forEach(function (c) { if (last.modes.indexOf(c) < 0) last.modes += c; }); return; }
    out.push({ a: a, b: b, labels: [s.label], raw: [s], ret: s.ret, modes: s.modes });
  });
  out.forEach(function (x, i) { x.n = i + 1; x.text = joinLabels(x.labels, ' · +'); x.modes = ALLM.split('').filter(function (c) { return c && x.modes.indexOf(c) >= 0; }).join(''); });

}
function stepKind(x) { return modeTone(x.modes); }

  document.getElementById('dyn-folded').textContent = d.folded ? d.folded + ' internal interaction' + (d.folded > 1 ? 's' : '') + ' folded into their box' : '';

}
function dispName(n) { return dyn.level === 'pins' && !isPinned(n.id) && pins.some(function (id) { return within(byId[id], n); }) ? 'rest of ' + n.name : n.name; }
function participants(steps) { var p = []; steps.forEach(function (s) { [s.a, s.b].forEach(function (n) { if (p.indexOf(n) < 0) p.push(n); }); }); return p; }

  parts.forEach(function (n) { if (!depth.has(n)) depth.set(n, 0); });
  var minD = Math.min.apply(null, Array.from(depth.values()).concat([0]));
  var cols = {}; parts.forEach(function (n) { var c = depth.get(n) - minD; (cols[c] = cols[c] || []).push(n); });
  var BW = 230, BH = 92, CGAP = 230, RGAP = 70, M = 40, pos = new Map();

  var ncol = colKeys.length, maxRows = Math.max.apply(null, colKeys.map(function (k) { return cols[k].length; }).concat([1]));

  if (ev.target === scModal) scModal.close();   // a click on the backdrop
});
scModal.addEventListener('keydown', function (ev) { ev.stopPropagation(); });   // the page's shortcuts stay off while it is open; Esc still closes it
document.getElementById('dyn-pick').onclick = openScModal;
function syncDyn() {
  document.querySelectorAll('#dyn-level button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lv === dyn.level)); });
  document.querySelectorAll('#dyn-style button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.st === dyn.style)); });
  scSel.value = String(dyn.sc);
}
// collaboration diagrams stay readable up to L2; deeper (or free-form) levels default to the sequence diagram until the reader picks a style
function autoStyle() { if (!dyn.styleChosen) dyn.style = (dyn.level === '1' || dyn.level === '2') ? 'collab' : 'seq'; }
document.querySelectorAll('#dyn-level button').forEach(function (b) { b.onclick = function () { dyn.level = b.dataset.lv; autoStyle(); dyn.step = 0; syncDyn(); renderDyn(); renderPanel(); }; });
document.querySelectorAll('#dyn-style button').forEach(function (b) { b.onclick = function () { dyn.style = b.dataset.st; dyn.styleChosen = true; syncDyn(); renderDyn(); writeHash(); }; });
syncDyn();
document.getElementById('dyn-prev').onclick = function () { stopPlay(); goStep(dyn.step - 1); };
document.getElementById('dyn-next').onclick = function () { stopPlay(); goStep(dyn.step + 1); };
document.getElementById('dyn-play').onclick = togglePlay;
document.getElementById('dyn-wrap').addEventListener('click', function (ev) {
  var st = ev.target.closest('[data-step]');
  if (st && st.dataset.step !== '') { stopPlay(); goStep(+st.dataset.step); return; }
  var g = ev.target.closest('.nd');
  if (g) { selected = byId[g.dataset.id]; renderPanel(); }
});

function renderStepPanel() {
  var sc = SCEN[dyn.sc], d = dynSteps(), s = d.steps[dyn.step];
  var lvName = dyn.level === 'map' ? 'as opened on the map' : dyn.level === 'pins' ? 'your pinned elements' : 'L' + dyn.level + ' · ' + LEVEL_NAME[dyn.level].toLowerCase();
  var html = sheetBtn() + '<span class="ptag">Dynamic diagram · drawn at ' + esc(lvName) + '</span><h2>' + esc(sc.name) + '</h2>' + (sc.desc ? '<p>' + esc(sc.desc) + '</p>' : '');
  if (!s) { panel.innerHTML = html + '<p>No interactions cross a box boundary at this level' + (NV ? ' for the selected ' + esc(VAR_LABEL.toLowerCase()) : '') + '. Pick a deeper level.</p>'; return; }
  html += '<h3>Step ' + s.n + ' of ' + d.steps.length + '</h3>' +
    '<p style="font-size:16px"><b>' + esc(dispName(s.a)) + '</b> ' + (s.ret ? '⇠ replies to' : '→') + ' <b>' + esc(dispName(s.b)) + '</b></p>' +
    '<div class="actions"><button type="button" class="btn" data-act="step-prev">◀ previous</button><button type="button" class="btn" data-act="step-next">next ▶</button></div>' +
    (NV ? '<h3>' + esc(VAR_LABEL) + '</h3><div class="chips">' + s.modes.split('').map(chip).join('') + '</div>' : '') +
    '<h3>Underlying interactions (' + s.raw.length + ')</h3><div class="rel">' + s.raw.map(function (r) {
      var f = byId[r.from], t = byId[r.to];
      return '<button type="button" data-go="' + esc(t.id) + '"><i>' + (r.ret ? '⇠' : '→') + '</i>' + esc(r.label) + '<small>' + esc(f.name) + ' → ' + esc(t.name) + (t.path ? ' · ' + esc(t.path) + (t.line ? ':' + t.line : '') : '') + '</small></button>';
    }).join('') + '</div>' +
    '<h3>About dynamic diagrams</h3><p>A dynamic diagram shows how the elements of the static model collaborate at runtime for one scenario. The same numbered interactions can be drawn as a <b>collaboration</b> diagram (free-form, numbered arrows), a <b>sequence</b> diagram, or a plain list. Drawing them at a higher level folds interactions that stay inside one box.</p>';
  panel.innerHTML = html;
}

/* ======================================================================
   export: the model as an RDF graph (mapping in the "rdf" script above)
   JSON-LD is written locally. A .rete file needs the rete-graph builder (WebAssembly), which is fetched from
   the CDN only when that menu entry is used; everything else on the page works offline.
   ====================================================================== */
var RETE_URL = 'https://cdn.jsdelivr.net/npm/rete-graph@0.7.4/dist/rete-graph.min.js';
var rdfCache = null, reteLoading = null;
var exportBtn = document.getElementById('btn-export'), exportMenu = document.getElementById('export-menu'), exportMsg = document.getElementById('export-msg');
function rdf() { return rdfCache || (rdfCache = window.archRdf(MODEL)); }
function say(text, bad) { exportMsg.textContent = text; exportMsg.classList.toggle('bad', !!bad); }
function saveFile(data, type, name) {
  var url = URL.createObjectURL(new Blob([data], { type: type })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function loadRete() {
  if (window.rete && window.rete.build) return Promise.resolve(window.rete);
  if (!reteLoading) reteLoading = new Promise(function (ok, fail) {
    var s = document.createElement('script'); s.src = RETE_URL;
    s.onload = function () { if (window.rete && window.rete.build) ok(window.rete); else fail(new Error('the script loaded but did not provide rete.build')); };
    s.onerror = function () { reteLoading = null; s.remove(); fail(new Error('could not load the rete builder from ' + RETE_URL)); };
    document.head.appendChild(s);
  });
  return reteLoading;
}
function buildRete() { return loadRete().then(function (r) { return r.build(rdf().toNTriples(), 'nt'); }); }
function exportAs(kind) {
  var g = rdf();
  if (kind === 'jsonld') {
    saveFile(JSON.stringify(g.toJsonLd(), null, 2), 'application/ld+json', g.fileStem + '.jsonld');
    say('Saved ' + g.fileStem + '.jsonld · ' + g.tripleCount() + ' triples');
    return Promise.resolve(true);
  }
  say('Loading the rete builder…');
  return buildRete().then(function (bytes) {
    saveFile(bytes, 'application/octet-stream', g.fileStem + '.rete');
    say('Saved ' + g.fileStem + '.rete · ' + g.tripleCount() + ' triples · ' + bytes.length + ' bytes');
    return true;
  }, function (err) {
    say('No .rete file: ' + (err && err.message || err) + '. This step needs a network connection. Download the JSON-LD instead; "rete build ' + g.fileStem + '.jsonld -o ' + g.fileStem + '.rete" turns it into the same graph.', true);
    return false;
  });
}
exportBtn.onclick = function () { exportMenu.hidden = !exportMenu.hidden; exportBtn.setAttribute('aria-expanded', String(!exportMenu.hidden)); if (!exportMenu.hidden) say(''); };
exportMenu.addEventListener('click', function (ev) { var b = ev.target.closest('[data-export]'); if (b) exportAs(b.dataset.export); });
document.addEventListener('click', function (ev) { if (!ev.target.closest('.export') && !exportMenu.hidden) { exportMenu.hidden = true; exportBtn.setAttribute('aria-expanded', 'false'); } });

/* ======================================================================
   URL state. The hash mirrors what is on screen, so any view can be linked, reloaded or screenshotted:
   #level=3  #open=api,orders  #sel=place-order  #variant=cloud  #labels=0  #theme=dark
   #view=pins  #view=dynamic&scenario=checkout&at=3&style=seq&step=4
   read-only extras: zoom=<id> fits the camera to one box, pins=a,b sets the pinned board for this visit
   ====================================================================== */
function readHash() {
  var s = (location.hash || '').replace(/^#/, ''), o = {};
  if (!s) return o;
  if (s.indexOf('=') < 0) { o.view = s; return o; }
  s.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i < 1) return; try { o[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} });
  return o;
}
function writeHash() {
  if (!booted) return;
  var p = [], enc = encodeURIComponent;
  if (view !== 'map') p.push('view=' + view);
  var lv = LEVELS.filter(function (l) { var ids = C.levelSet(l); return ids.length === expanded.size && ids.every(function (id) { return expanded.has(id); }); })[0];
  p.push(lv ? 'level=' + lv : 'open=' + Array.from(expanded).map(enc).join(','));
  if (selected) p.push('sel=' + selList().map(function (n) { return enc(n.id); }).join(','));
  if (mode !== 'all') p.push('variant=' + enc(VBY[mode].id));
  if (view === 'dynamic' && SCEN[dyn.sc]) p.push('scenario=' + enc(SCEN[dyn.sc].id), 'at=' + dyn.level, 'style=' + dyn.style, 'step=' + (dyn.step + 1));
  // boxes showing a sequence inside: seq=<box>:<scenario>,…  and the picked message: seqstep=<box>:<n>
  var sqs = Array.from(seqView.keys()).filter(function (id) { return isSeq(byId[id]) && visible(byId[id]); });
  if (sqs.length) p.push('seq=' + sqs.map(function (id) { return enc(id) + ':' + enc(SCEN[seqView.get(id)].id); }).join(','));
  if (seqSel && view === 'map') p.push('seqstep=' + enc(seqSel.id) + ':' + (seqSel.step + 1));
  if (!showLabels) p.push('labels=0');
  if (C.edgeStyle() !== EDGES_DEFAULT) p.push('edges=' + C.edgeStyle());
  if (theme !== THEME_DEFAULT) p.push('theme=' + theme);
  try { history.replaceState(null, '', '#' + p.join('&')); } catch (e) {}
}
function idList(s) { return String(s || '').split(',').map(function (x) { return x.trim(); }).filter(function (id) { return byId[id]; }); }
function openWithAncestors(id) { expanded.add(id); ancestors(byId[id]).forEach(function (a) { expanded.add(a.id); }); }

/* ======================================================================
   boot: state from the URL hash, else view.open / view.startLevel (default level 2), fitted
   ====================================================================== */
var H = readHash();
if (THEMES.indexOf(H.theme) >= 0) { hashTheme = theme = H.theme; applyTheme(); }
if (H.open !== undefined) idList(H.open).forEach(openWithAncestors);
else if (H.level) openToLevel(Math.max(1, Math.min(MAXL, +H.level || 1)));
else if (VIEW.open) VIEW.open.forEach(openWithAncestors);
else openToLevel(Math.min(VIEW.startLevel || 2, MAXL));
// sel=a or sel=a,b,c (several selected; the last is the primary one)
if (H.sel && idList(H.sel).length) { setSel(idList(H.sel).map(function (id) { return byId[id]; })); selList().forEach(function (n) { ancestors(n).forEach(function (a) { expanded.add(a.id); }); }); }
// seq=api:upload,worker  → those boxes show the sequence of that scenario inside (default: the first one through them)
function splitLast(kv) { var i = kv.lastIndexOf(':'); return i > 0 ? [kv.slice(0, i), kv.slice(i + 1)] : [kv, '']; }
if (H.seq) H.seq.split(',').forEach(function (kv) {
  var p = splitLast(kv.trim()), n = byId[p[0]], si = -1;
  if (!n || !n.seqScen.length) return;
  SCEN.forEach(function (s, j) { if (s.id === p[1] && n.seqScen.indexOf(j) >= 0) si = j; });
  ancestors(n).forEach(function (a) { expanded.add(a.id); seqView.delete(a.id); });
  NODES.forEach(function (x) { if (within(x, n)) expanded.delete(x.id); });
  seqView.set(n.id, si >= 0 ? si : n.seqScen[0]);
});
if (H.pins !== undefined) pins = idList(H.pins);
if (H.edges) { C.setEdgeStyle(H.edges); syncEdges(); }
if (H.labels === '0') { showLabels = false; svg.classList.remove('labels'); lblBtn.setAttribute('aria-pressed', 'false'); }
if (H.variant) VCH.forEach(function (c) { if (VBY[c].id === H.variant) mode = c; });
if (mode !== 'all') { svg.setAttribute('data-mode', mode); document.querySelectorAll('#modes button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); }); }
if (HAS_DYN) {
  SCEN.forEach(function (s, i) { if (s.id === H.scenario) dyn.sc = i; });
  if (LEVELS.map(String).concat(['map', 'pins']).indexOf(H.at) >= 0) { dyn.level = H.at; autoStyle(); }
  if (['collab', 'seq', 'list'].indexOf(H.style) >= 0) { dyn.style = H.style; dyn.styleChosen = true; }
  if (+H.step > 0) dyn.step = Math.floor(+H.step) - 1;
  syncDyn();
}
layout(); aggregate(); cur = new Map(target);
if (H.seqstep) { var ss = splitLast(H.seqstep), sn = byId[ss[0]]; if (sn && isSeq(sn) && +ss[1] > 0) { seqSel = { id: sn.id, step: Math.min(sn._seq.steps.length, Math.floor(+ss[1])) - 1 }; if (!H.sel) selected = null; } }
renderPanel(); // before fitting: on narrow screens the panel takes height away from the canvas
var zr = H.zoom && target.get(H.zoom), f0 = zr ? fitTo(zr, 40) : fitAll(); cam.x = f0.x; cam.y = f0.y; cam.s = f0.s;
applyCam(); redraw(); crumb(); syncLevel();
if (VIEWS.indexOf(H.view) > 0) setView(H.view);
booted = true;
root.setAttribute('data-explorer', 'ready');
// read-only handle for checks and debugging; `api` drives the UI the same way the buttons do
window.ARCH_EXPLORER = { ready: true, errors: [], warnings: CHECK.warnings,
  counts: { nodes: NODES.length, edges: EDGES.length, scenarios: SCEN.length, levels: MAXL, variants: NV },
  layout: function () { return C.analyse(target, agg); },
  rdf: { jsonld: function () { return JSON.stringify(rdf().toJsonLd(), null, 2); }, ntriples: function () { return rdf().toNTriples(); }, tripleCount: function () { return rdf().tripleCount(); },
    buildRete: buildRete, download: exportAs },
  api: { setView: setView, setLevel: setLevel, setMode: setMode, reveal: function (id) { reveal(byId[id]); }, toggle: function (id) { toggle(byId[id]); },
    setScenario: function (i) { scSel.value = String(i); scSel.onchange(); }, setDynStyle: function (s) { document.querySelector('#dyn-style [data-st="' + s + '"]').click(); },
    setDynLevel: function (l) { document.querySelector('#dyn-level [data-lv="' + l + '"]').click(); }, sourceUrl: function (id) { return repoUrl(byId[id]); },
    showSeq: function (id, scenarioId) { var j = -1; SCEN.forEach(function (s, i) { if (s.id === scenarioId) j = i; }); showSeq(byId[id], j >= 0 ? j : undefined); },
    showBoxes: function (id) { showBoxes(byId[id]); }, pickSeqStep: function (id, i) { pickSeqStep(byId[id], i); } } };
})();
</script>
